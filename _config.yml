# Feature List
features:
  - title: One-Tap Time Tracking
    description: Start tracking billable hours instantly with a single tap. No complex setup, no friction.
    fontawesome_icon_name: stopwatch
  - title: Invoicing & Quotes
    description: Create professional invoices and quotes in seconds. Send to clients directly from your iPhone.
    fontawesome_icon_name: file-invoice-dollar
  - title: Earnings Calculator
    description: See your billable earnings in real-time as you track time. Know exactly what you've earned.
    fontawesome_icon_name: dollar-sign
  - title: Advanced Analytics
    description: Understand productivity patterns with daily, weekly, and monthly insights.
    fontawesome_icon_name: chart-line
  - title: Widgets
    description: Track time from your home screen and lock screen. Quick access to timers.
    fontawesome_icon_name: mobile-alt
  - title: Privacy-First Design
    description: All data stays on your device. Optional iCloud sync keeps it in your Apple ecosystem.
    fontawesome_icon_name: lock

